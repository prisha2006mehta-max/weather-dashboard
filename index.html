<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="weather-container">
    <header class="app-header">
      <h1>Weather Dashboard</h1>
      <p>Search any city to check real-time weather conditions</p>
    </header>

    <form id="searchForm" class="search-box">
      <input 
        type="text" 
        id="cityInput" 
        placeholder="Enter city name..." 
        autocomplete="off"
        required
      />
      <button type="submit">Search</button>
    </form>

    <!-- Error / Status Message Container -->
    <div id="statusMessage" class="status-message hidden"></div>

    <!-- Weather Display Card -->
    <div id="weatherCard" class="weather-card hidden">
      <div class="card-header">
        <h2 id="cityName">--</h2>
        <p id="weatherDescription">--</p>
      </div>

      <div class="temp-section">
        <span id="temperature">--</span>°C
      </div>

      <div class="details-grid">
        <div class="detail-item">
          <span class="label">Humidity</span>
          <span id="humidity" class="value">--%</span>
        </div>
        <div class="detail-item">
          <span class="label">Wind Speed</span>
          <span id="windSpeed" class="value">-- m/s</span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
